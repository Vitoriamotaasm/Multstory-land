<!doctype html>
<html lang="pt-BR" class="is-loading intro-hold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MultStory — marketing de alta performance, social media, audiovisual, tráfego pago e design." />
    <link rel="icon" href="/favicon.svg" />
    <title>MultStory — Marketing de alta performance</title>

    <!--
      INTRO — parte 1 (loading)
      Uma linha de luz desenha o M da logo. Roda só com CSS, antes do JS carregar.
      A continuação (perna direita → quadrado do hero, setas nos M, encaixe na navbar)
      é controlada por src/intro/intro.ts.
    -->
    <style>
      html.is-loading { overflow: hidden; }

      /* segura as entradas do hero até a linha sair do M */
      html.intro-hold #app .reveal,
      html.intro-hold #app .hero__visual-fade,
      html.intro-hold #app .hero__title--enter { animation-play-state: paused; }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background-color: #000;
        transition: background-color .9s ease;
      }
      #preloader.is-open { background-color: transparent; pointer-events: none; }

      /* linha que sai da perna direita do M (coordenadas em px da janela) */
      #intro-line {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }
      #intro-line path { fill: none; stroke-linecap: round; opacity: 0; }
      #intro-conn, #intro-arrow {
        stroke: #9dbaf7;
        stroke-width: 1.5;
        filter: drop-shadow(0 0 5px rgba(90, 140, 255, .9));
      }
      #intro-conn-glow { stroke: #5f8dff; stroke-width: 12; filter: blur(5px); }
      #intro-conn-dot  { stroke: #fff; stroke-width: 3.5; }
      #intro-arrow-head {
        stroke: #f1f5ff;
        stroke-width: 2.5;
        stroke-linejoin: round;
        filter: drop-shadow(0 0 5px rgba(110, 150, 255, 1));
      }

      /* o M */
      #intro-m {
        grid-area: 1 / 1;
        width: clamp(88px, 14vw, 140px);
        height: auto;
        overflow: visible;
        transform-origin: 0 0;
        will-change: transform;
      }
      #intro-m .m-glow {
        filter: drop-shadow(0 0 7px rgba(86, 134, 230, .6));
        transition: filter .7s ease;
      }
      #intro-m.is-docking .m-glow { filter: drop-shadow(0 0 0 rgba(86, 134, 230, 0)); }
      #intro-m .m-shape path { fill: #4674C4; stroke: #4674C4; stroke-width: 20; }

      /* máscara: o M só aparece por onde a luz já passou */
      .m-reveal, .m-reveal-head { fill: none; stroke: #fff; }
      .m-reveal {
        stroke-width: 1300;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 15913 17913;
        stroke-dashoffset: 16613;
        animation: m-draw 1700ms linear forwards;
      }
      .m-reveal-head {
        stroke-width: 2100;
        stroke-dasharray: 1262 1262;
        stroke-dashoffset: 1262;
        animation: m-draw-head 1700ms linear forwards;
      }

      /* a luz: ponto com glow + rastro, andando pelo traçado do M */
      .m-spark {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: opacity .12s linear;
      }
      .m-spark--glow  { stroke: #6f9bff; stroke-width: 1500; stroke-dasharray: 1 99999;    stroke-dashoffset: 1;    opacity: .85; animation: m-spark-glow  1700ms linear infinite; }
      .m-spark--trail { stroke: #a9c4ff; stroke-width: 150;  stroke-dasharray: 2400 99999; stroke-dashoffset: 2400; opacity: .55; animation: m-spark-trail 1700ms linear infinite; }
      .m-spark--core  { stroke: #fff;    stroke-width: 130;  stroke-dasharray: 700 99999;  stroke-dashoffset: 700;  animation: m-spark-core 1700ms linear infinite; }
      #intro-m.is-released .m-spark { opacity: 0; }

      @keyframes m-draw        { to { stroke-dashoffset: 0; } }
      @keyframes m-draw-head   { 0%, 62.7% { stroke-dashoffset: 1262; } 70.6%, 100% { stroke-dashoffset: 0; } }
      @keyframes m-spark-glow  { to { stroke-dashoffset: -15912; } }
      @keyframes m-spark-trail { to { stroke-dashoffset: -13513; } }
      @keyframes m-spark-core  { to { stroke-dashoffset: -15213; } }

      @media (prefers-reduced-motion: reduce) {
        .m-reveal, .m-reveal-head { animation: none; stroke-dashoffset: 0; }
        .m-spark { display: none; }
      }
    </style>
  </head>

    <script>
      /* rede de segurança: se o app não assumir a intro, libera o site mesmo assim */
      setTimeout(function () {
        if (window.__introStarted) return
        var el = document.getElementById('preloader')
        if (el) el.remove()
        document.documentElement.classList.remove('is-loading', 'intro-hold')
        document.documentElement.classList.add('intro-done')
      }, 9000)
    </script>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
